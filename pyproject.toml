[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "zh-lipsync"
version = "0.1.0"
description = "Mandarin speech -> mouth-shape (viseme) timeline for 2D avatars: Live2D, mesh avatars, VTubers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "faster-whisper>=1.0",   # MIT
    "pypinyin>=0.50",        # MIT
    "numpy>=1.21",           # BSD-3-Clause
]
keywords = ["lipsync", "lip-sync", "mandarin", "chinese", "viseme", "live2d", "vtuber", "zhuyin", "pinyin"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Natural Language :: Chinese (Traditional)",
    "Natural Language :: Chinese (Simplified)",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

[project.optional-dependencies]
opencc = ["opencc>=1.1"]   # Apache-2.0; better polyphone readings for traditional Chinese

[project.scripts]
zh-lipsync = "zh_lipsync.cli:main"

[tool.setuptools]
packages = ["zh_lipsync"]
